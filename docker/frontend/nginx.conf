# 商超进销存 · 前端 Nginx 配置
# 要点：
#  1) /prod-api/ 反代 backend:8080，结尾斜杠规则：/prod-api/xxx → backend:8080/xxx（RuoYi 生产标准写法）
#  2) SSE 到账广播（/prod-api/jxc/pay/subscribe）依赖：proxy_buffering off + HTTP/1.1 + Connection ''，禁止缓冲
#  3) 前端 history 路由：try_files 回退 index.html

server {
    listen       80;
    server_name  localhost;

    # 前端静态资源（Vite 产物，文件名带 hash，可长缓存）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        root   /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口反代
    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置（勿删）：到账广播事件流一旦缓冲就会收不到
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # 上传文件大小与后端 spring multipart 对齐
        client_max_body_size 20m;
    }
}
